apiVersion: 1
datasources:
  - name: Vault Audit · Loki
    uid: lumen-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '00-([0-9a-f]{32})-[0-9a-f]{16}-01'
          datasourceUid: lumen-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Abrir traza
  - name: Lumen · Tempo
    uid: lumen-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: lumen-loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service="vault-audit"} |= "$${__trace.traceId}"'
      nodeGraph:
        enabled: true
